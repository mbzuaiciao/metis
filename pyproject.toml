[project]
name = "metis"
version = "0.1.0"
description = "Institutional portfolio risk and financial reasoning workstation"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "numpy>=2,<3", "pandas>=2.2,<4", "httpx>=0.28,<1", "python-dotenv>=1,<2"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/metis"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
